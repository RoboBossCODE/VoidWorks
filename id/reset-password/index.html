<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#08090d">
  <title>Reset Password — VOIDWORKS ID</title>
  <link rel="stylesheet" href="../style.css?v=10">
</head>
<body>
  <div class="bg-grid" aria-hidden="true"></div><div class="glow glow-a" aria-hidden="true"></div>
  <header class="topbar"><a class="brand" href="../../"><span class="brand-mark"><i></i><i></i></span><span>VOIDWORKS <small>/ ID</small></span></a><div class="top-actions"><button id="themeBtn" class="theme" type="button">◐</button></div></header>
  <main class="auth-shell" style="grid-template-columns:minmax(0,560px);justify-content:center">
    <section class="auth-card">
      <div class="card-top"><div><div class="kicker">VOIDWORKS / RECOVERY</div><h2>Choose a new password.</h2></div><span class="status-dot">SECURE</span></div>
      <p class="step-copy">Use a unique password with at least 8 characters, including a letter and a number.</p>
      <form id="resetForm">
        <label>New password<span class="password-wrap"><input id="newPassword" type="password" autocomplete="new-password" minlength="8" required placeholder="New password"><button class="show-pass" type="button" data-for="newPassword">SHOW</button></span></label>
        <label>Confirm new password<span class="password-wrap"><input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" required placeholder="Repeat password"><button class="show-pass" type="button" data-for="confirmPassword">SHOW</button></span></label>
        <button class="primary-btn" type="submit">UPDATE PASSWORD →</button>
      </form>
      <div id="message" class="message" role="status" aria-live="polite"></div>
      <p class="privacy-foot"><a class="hub-link" href="../">← Back to Voidworks ID</a></p>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../config.js?v=10"></script>
  <script src="reset.js?v=10"></script>
</body>
</html>
